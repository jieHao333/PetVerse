server:
  port: 8080

spring:
  application:
    name: gateway-service
  codec:
    # 网关为 WebFlux 架构，需放行宠域空间大视频上传的请求体缓存
    max-in-memory-size: 55MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: pet-service
          uri: lb://pet-service
          predicates:
            - Path=/api/pet/**
          filters:
            - StripPrefix=1
        - id: space-service
          uri: lb://space-service
          predicates:
            - Path=/api/space/**
          filters:
            - StripPrefix=1
        - id: social-service
          uri: lb://social-service
          predicates:
            - Path=/api/social/**
          filters:
            - StripPrefix=1
        - id: remark-service
          uri: lb://remark-service
          predicates:
            - Path=/api/remark/**
          filters:
            - StripPrefix=1
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/api/shop/**
          filters:
            - StripPrefix=1
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 120000
            connect-timeout: 3000

auth:
  # 免鉴权路径白名单，逗号分隔，支持前缀匹配
  whitelist-paths: /api/user/login,/api/user/register

jwt:
  # 与 user-service 保持一致
  secret: petverse-jwt-secret-key-please-change-in-production-2026
