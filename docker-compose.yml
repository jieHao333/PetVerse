name: petverse

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: petverse
      MYSQL_USER: ${MYSQL_USERNAME:-petverse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petverse123}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./PetVerseSingle/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: petverse_ai
      POSTGRES_USER: ${PG_USER:-petverse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-petverse123}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./ai-service/db/schema_pgvector.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: petverse-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-petverse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-petverse123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    ports:
      - "8848:8848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  app:
    image: petverse-single:latest
    build:
      context: ./PetVerseSingle
    environment:
      SPRING_PROFILES_ACTIVE: server
      MYSQL_URL: "jdbc:mysql://mysql:3306/petverse?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: ${MYSQL_USERNAME:-petverse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petverse123}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-petverse}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petverse123}
      MQ_ENABLED: "true"
      ES_URIS: http://elasticsearch:9200
      PETVERSE_SEARCH_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-petverse-jwt-secret-key-please-change-in-production-2026}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-petverse-internal-token-change-me}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  ai-service:
    image: petverse-ai:latest
    build:
      context: ./ai-service
    env_file:
      - ./ai-service/.env
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: "8086"
      AI_SERVICE_IP: ""
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_GROUP: DEFAULT_GROUP
      NACOS_NAMESPACE: ""
      SERVICE_DEPLOY_MODE: monolith
      MONOLITH_SERVICE_NAME: petverse-single
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-petverse-internal-token-change-me}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: petverse_ai
      PG_USER: ${PG_USER:-petverse}
      PG_PASSWORD: ${PG_PASSWORD:-petverse123}
      REDIS_HOST: redis
      REDIS_DB: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    volumes:
      - ai-data:/app/data
      - ai-skills:/app/skills
    restart: unless-stopped

  web:
    image: petverse-web:latest
    build:
      context: ../PetVerse-web
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  pg-data:
  rabbitmq-data:
  es-data:
  nacos-data:
  nacos-logs:
  ai-data:
  ai-skills:
