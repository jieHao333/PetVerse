# =============================================================
# Nacos 配置：dataId=pet-service  group=DEFAULT_GROUP  type=yaml
# 宠物服务全部配置，由 Nacos 配置中心统一下发
# =============================================================
server:
  port: 8081

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/petverse_pet?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池：限制单实例数据库连接数，连接耗尽时快速失败而不是长时间排队
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      # 小于 MySQL wait_timeout，避免使用到已被服务端关闭的连接
      max-lifetime: 1800000
      pool-name: pet-pool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      # 签到 BitMap 专用库，与点赞（db2）、AI 缓存（db3）隔离
      database: 1
      lettuce:
        pool:
          # 连接池：控制单实例 Redis 连接数，取连接超时后快速失败
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
  # RabbitMQ：消费动态发布事件，异步为宠物发放经验奖励；连接异常时消费自动重连，不影响其他功能
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 发布确认：发送侧据此判定消息是否真正落到队列（未确认即触发本地兜底）
    publisher-confirm-type: correlated
    # 无法路由的消息退回给生产者，避免"发送成功但无人消费"
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      # 单个头像文件上限（2MB + 冗余）
      max-file-size: 3MB
      max-request-size: 4MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境请通过环境变量 JWT_SECRET 覆盖此开发默认值（需与 user-service 一致）
  secret: ${JWT_SECRET:***********************}

# 业务开关：MQ 总开关关闭后不启动任何消费者、消息发送直接走本地降级逻辑
petverse:
  mq:
    enabled: ${MQ_ENABLED:true}

# 阿里云 OSS 存储配置（与其他服务共用同一个桶），宠物头像上传用
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:***********************}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:***********************}
    bucket-name: ${OSS_BUCKET_NAME:petverse-me}
