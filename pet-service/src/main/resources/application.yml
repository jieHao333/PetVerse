server:
  port: 8081

spring:
  application:
    name: pet-service
  datasource:
    url: jdbc:mysql://localhost:3306/petverse_pet?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 单个头像文件上限（2MB + 冗余）
      max-file-size: 3MB
      max-request-size: 4MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: petverse-jwt-secret-key-please-change-in-production-2026

# RocketMQ：消费动态发布事件，异步为宠物发放经验奖励；未启动 Broker 时消费不可用，不影响其他功能
rocketmq:
  name-server: localhost:9876
  producer:
    group: pet-producer

# 阿里云 OSS 存储配置（与其他服务共用同一个桶），宠物头像上传用
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: LTAI5t7e17sduSC8q6dDJmvP
    access-key-secret: dohM2Q5abNDOtAzSrqm0zig4WZwDY1
    bucket-name: petverse-me
