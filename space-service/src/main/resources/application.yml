server:
  port: 8082

spring:
  application:
    name: space-service
  datasource:
    url: jdbc:mysql://localhost:3306/petverse_space?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 单个媒体文件上限（视频 50MB + 冗余）
      max-file-size: 55MB
      # 单次请求总上限（上传接口单文件，略大于文件上限即可）
      max-request-size: 60MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: petverse-jwt-secret-key-please-change-in-production-2026

# 阿里云 OSS 存储配置（与 user-service 共用同一个桶）
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: LTAI5t7e17sduSC8q6dDJmvP
    access-key-secret: dohM2Q5abNDOtAzSrqm0zig4WZwDY1
    bucket-name: petverse-me
