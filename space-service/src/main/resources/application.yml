server:
  port: 8082

spring:
  config:
    # 本地密钥文件（已在 .gitignore 中忽略，不会提交）：存在时自动加载，为 OSS 密钥提供本地默认值
    import: optional:classpath:secrets-local.yml
  application:
    name: space-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/petverse_space?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 单个媒体文件上限（视频 50MB + 冗余）
      max-file-size: 55MB
      # 单次请求总上限（上传接口单文件，略大于文件上限即可）
      max-request-size: 60MB
  # Elasticsearch 8.15.5，用于动态全文检索；未启动时搜索自动降级为数据库模糊查询
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 2s
    socket-timeout: 5s

# 搜索开关，置为 false 则全部走数据库模糊查询
petverse:
  search:
    enabled: true

# RocketMQ：发布动态事件（宠物经验/索引）与点赞变更事件的生产与消费；
# 未启动 Broker 时发送自动降级为记日志，不影响主流程
rocketmq:
  name-server: localhost:9876
  producer:
    group: space-producer

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境请通过环境变量 JWT_SECRET 覆盖此开发默认值（需与 user-service 一致）
  secret: ${JWT_SECRET:petverse-jwt-secret-key-please-change-in-production-2026}

# 阿里云 OSS 存储配置（与 user-service 共用同一个桶）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    # 密钥优先级：环境变量 > 本地密钥文件 secrets-local.yml（local.oss.*）> 空
    access-key-id: ${OSS_ACCESS_KEY_ID:${local.oss.access-key-id:}}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:${local.oss.access-key-secret:}}
    bucket-name: ${OSS_BUCKET_NAME:petverse-me}
    # 可选：自定义/CDN 域名（含协议），为空时按桶默认域名拼接
    domain: ${OSS_DOMAIN:}
