server:
  port: 8082

spring:
  application:
    name: space-service
  datasource:
    url: jdbc:mysql://localhost:3306/petverse_space?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 单个媒体文件上限（视频 50MB + 冗余）
      max-file-size: 55MB
      # 单次请求总上限（上传接口单文件，略大于文件上限即可）
      max-request-size: 60MB
  # Elasticsearch 8.15.5，用于动态全文检索；未启动时搜索自动降级为数据库模糊查询
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 2s
    socket-timeout: 5s

# 搜索开关，置为 false 则全部走数据库模糊查询
petverse:
  search:
    enabled: true

# RocketMQ：发布动态事件（宠物经验/索引）与点赞变更事件的生产与消费；
# 未启动 Broker 时发送自动降级为记日志，不影响主流程
rocketmq:
  name-server: localhost:9876
  producer:
    group: space-producer

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: petverse-jwt-secret-key-please-change-in-production-2026

# 阿里云 OSS 存储配置（与 user-service 共用同一个桶）
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: LTAI5t7e17sduSC8q6dDJmvP
    access-key-secret: dohM2Q5abNDOtAzSrqm0zig4WZwDY1
    bucket-name: petverse-me
    # 可选：自定义/CDN 域名（含协议），为空时按桶默认域名拼接
    domain: ""
