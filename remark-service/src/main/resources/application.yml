server:
  port: 8085

spring:
  application:
    name: remark-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/petverse_remark?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池：限制单实例数据库连接数，连接耗尽时快速失败而不是长时间排队
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      # 小于 MySQL wait_timeout，避免使用到已被服务端关闭的连接
      max-lifetime: 1800000
      pool-name: remark-pool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 2
      lettuce:
        pool:
          # 连接池：控制单实例 Redis 连接数，取连接超时后快速失败
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境请通过环境变量 JWT_SECRET 覆盖此开发默认值（需与 user-service 一致）
  secret: ${JWT_SECRET:petverse-jwt-secret-key-please-change-in-production-2026}

# RocketMQ：点赞/取消点赞时发布变更事件，业务侧据此近实时刷新热度；
# 未启动 Broker 时发送自动降级为记日志，点赞功能本身不受影响（定时任务仍会同步计数）
rocketmq:
  name-server: localhost:9876
  producer:
    group: remark-producer
