server:
  port: 8085

spring:
  application:
    name: remark-service
  datasource:
    url: jdbc:mysql://localhost:3306/petverse_remark?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 2

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: petverse-jwt-secret-key-please-change-in-production-2026

# RocketMQ：点赞/取消点赞时发布变更事件，业务侧据此近实时刷新热度；
# 未启动 Broker 时发送自动降级为记日志，点赞功能本身不受影响（定时任务仍会同步计数）
rocketmq:
  name-server: localhost:9876
  producer:
    group: remark-producer
